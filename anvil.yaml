db_schema:
  endpoint_state:
    client: none
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: name
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: data
      type: simpleObject
    indexes: []
    server: full
    title: endpoint_state
  endpoints:
    client: none
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: name
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: url
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: type
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: expected_status
      type: number
    - admin_ui: {width: 200}
      client_hidden: false
      name: notify
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: enabled
      type: bool
    indexes: []
    server: full
    title: endpoints
  monitoring_history:
    client: none
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: endpoint_name
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: url
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: endpoint_type
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: status
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: http_status
      type: number
    - admin_ui: {width: 200}
      client_hidden: false
      name: response_time
      type: number
    - admin_ui: {width: 200}
      client_hidden: false
      name: error_message
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: timestamp
      type: datetime
    indexes: []
    server: full
    title: monitoring_history
